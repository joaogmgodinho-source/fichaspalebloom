    const Icon = ({ name, className = "w-4 h-4" }) => {
      const containerRef = React.useRef(null);

      useEffect(() => {
        if (window.lucide && containerRef.current) {
          const iconPascal = name.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');
          const iconNode = window.lucide.icons[iconPascal] || window.lucide.icons[name];
          if (iconNode) {
            const svgElement = window.lucide.createElement(iconNode);
            // Apply custom Tailwind classes to generated SVG
            className.split(' ').filter(Boolean).forEach(cls => svgElement.classList.add(cls));
            containerRef.current.innerHTML = '';
            containerRef.current.appendChild(svgElement);
          }
        }
      }, [name, className]);

      return <span ref={containerRef} className="inline-flex items-center justify-center" />;
    };

    // --- WEB AUDIO API SOUND GENERATOR FOR DICE ROLL ---
    const playDiceSound = () => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        // Create multiple small click/clack sounds to simulate dice rattling
        const rollsCount = 5;
        for (let i = 0; i < rollsCount; i++) {
          const startTime = ctx.currentTime + i * 0.05 + Math.random() * 0.02;
          
          // Buffer for noise
          const bufferSize = ctx.sampleRate * 0.03; // 30ms sound
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let j = 0; j < bufferSize; j++) {
            data[j] = Math.random() * 2 - 1;
          }

          const noise = ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(800 + Math.random() * 1200, startTime);
          filter.Q.setValueAtTime(3, startTime);

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.3, startTime);
          gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.03);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);

          noise.start(startTime);
        }
      } catch (e) {
        console.error("Audio play error", e);
      }
    };

    function App() {
      // --- STATE ---
      const [character, setCharacter] = useState(() => {
        const saved = localStorage.getItem('rpg_character_sheet_ordem');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) { console.error("Error loading sheet", e); }
        }
        return initialCharacterData;
      });

      const [activeTab, setActiveTab] = useState('combate');
      const [diceLogs, setDiceLogs] = useState([]);
      const [customDiceInput, setCustomDiceInput] = useState('2d20+5');
      const [periciaFilter, setPericiaFilter] = useState('');

      // Active Dice Toast / Popup State
      const [diceToast, setDiceToast] = useState(null);

      // Modals / Editors State
      const [showAttrModal, setShowAttrModal] = useState(false);
      const [newAttr, setNewAttr] = useState({ nome: '', valor: 1 });
      
      const [showBarModal, setShowBarModal] = useState(false);
      const [newBar, setNewBar] = useState({ nome: 'Nova Barra', atual: 20, max: 20, cor: '#3b82f6' });

      const [showPericiaModal, setShowPericiaModal] = useState(false);
      const [newPericia, setNewPericia] = useState({ nome: '', atributo: 'INT', bonus: 0, treinamento: 'Destreinado' });

      const [editingPericiaId, setEditingPericiaId] = useState(null);
      const [editingAtaqueId, setEditingAtaqueId] = useState(null);

      const [showAtaqueModal, setShowAtaqueModal] = useState(false);
      const [newAtaque, setNewAtaque] = useState({
        nome: '', teste: '2d20+5', danoFormula: '1d6+2', critico: '20/x2', alcance: 'Curto', tipo: 'Perfuração', especial: ''
      });

      const [editingAvatar, setEditingAvatar] = useState(false);
      const [tempAvatarUrl, setTempAvatarUrl] = useState('');

      // Save to LocalStorage
      useEffect(() => {
        localStorage.setItem('rpg_character_sheet_ordem', JSON.stringify(character));
      }, [character]);

      // --- DICE ROLLER LOGIC & POPUP TRIGGER ---
      const rollDiceFormula = (formulaStr, label = 'Rolagem Geral') => {
        playDiceSound();
        const cleaned = formulaStr.toLowerCase().replace(/\s+/g, '');
        let total = 0;
        let details = [];
        let individualDiceRolls = [];

        const regex = /([+-]?\d*d?\d+)/g;
        const matches = cleaned.match(regex);

        if (!matches) {
          addDiceLog("Erro na Fórmula", "Entrada inválida", 0);
          return;
        }

        matches.forEach(term => {
          let sign = 1;
          let t = term;
          if (t.startsWith('+')) {
            t = t.substring(1);
          } else if (t.startsWith('-')) {
            sign = -1;
            t = t.substring(1);
          }

          if (t.includes('d')) {
            const parts = t.split('d');
            const count = parts[0] === '' ? 1 : parseInt(parts[0], 10);
            const sides = parseInt(parts[1], 10);

            let rolls = [];
            for (let i = 0; i < count; i++) {
              const r = Math.floor(Math.random() * sides) + 1;
              rolls.push(r);
              individualDiceRolls.push({ sides, value: r, sign });
            }

            const subtotal = rolls.reduce((a, b) => a + b, 0) * sign;
            total += subtotal;
            details.push(`${sign < 0 ? '-' : '+'}${count}d${sides} [${rolls.join(', ')}]`);
          } else {
            const val = parseInt(t, 10) * sign;
            total += val;
            details.push(`${val >= 0 ? '+' : ''}${val}`);
          }
        });

        const detailText = details.join(' ');
        addDiceLog(label, detailText, total, formulaStr, individualDiceRolls);
      };

      const rollAttributeOrdem = (attrNome, diceCount) => {
        playDiceSound();
        const count = Math.max(1, diceCount);
        let rolls = [];
        let individualDiceRolls = [];

        for (let i = 0; i < count; i++) {
          const val = Math.floor(Math.random() * 20) + 1;
          rolls.push(val);
          individualDiceRolls.push({ sides: 20, value: val, sign: 1 });
        }
        
        const highest = Math.max(...rolls);
        const detailText = `${count}d20 [${rolls.join(', ')}] -> Maior: ${highest}`;
        
        addDiceLog(`Teste de ${attrNome}`, detailText, highest, `${count}d20`, individualDiceRolls);
      };

      const rollPericiaOrdem = (periciaNome, attrNome, bonus) => {
        playDiceSound();
        const attrObj = character.atributos.find(a => a.nome === attrNome);
        const attrVal = attrObj ? attrObj.valor : 1;
        const count = Math.max(1, attrVal);

        let rolls = [];
        let individualDiceRolls = [];

        for (let i = 0; i < count; i++) {
          const val = Math.floor(Math.random() * 20) + 1;
          rolls.push(val);
          individualDiceRolls.push({ sides: 20, value: val, sign: 1 });
        }
        const highest = Math.max(...rolls);
        const total = highest + bonus;
        const detailText = `${count}d20 [${rolls.join(', ')}] (Maior: ${highest}) + ${bonus}`;

        addDiceLog(`Perícia: ${periciaNome}`, detailText, total, `${count}d20+${bonus}`, individualDiceRolls);
      };

      const addDiceLog = (title, detail, result, formula, individualRolls = []) => {
        const newLog = {
          id: Date.now(),
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
          title,
          detail,
          result,
          formula,
          individualRolls
        };
        
        // Add to history list
        setDiceLogs(prev => [newLog, ...prev.slice(0, 30)]);

        // Trigger Popup at bottom
        setDiceToast(newLog);
      };

      // --- HANDLERS FOR CHARACTER UPDATES ---
      const updateProfile = (field, value) => {
        setCharacter(prev => ({
          ...prev,
          profile: { ...prev.profile, [field]: value }
        }));
      };

      const updateBarValue = (id, field, delta) => {
        setCharacter(prev => ({
          ...prev,
          barras: prev.barras.map(b => {
            if (b.id === id) {
              if (field === 'atual') {
                const newVal = Math.min(Math.max(0, b.atual + delta), b.max);
                return { ...b, atual: newVal };
              }
              if (field === 'max') {
                const newMax = Math.max(1, b.max + delta);
                return { ...b, max: newMax, atual: Math.min(b.atual, newMax) };
              }
            }
            return b;
          })
        }));
      };

      const updateBarDirect = (id, field, value) => {
        const val = parseInt(value, 10) || 0;
        setCharacter(prev => ({
          ...prev,
          barras: prev.barras.map(b => b.id === id ? { ...b, [field]: val } : b)
        }));
      };

      const addBar = () => {
        if (!newBar.nome) return;
        const barToAdd = { ...newBar, id: 'b_' + Date.now() };
        setCharacter(prev => ({ ...prev, barras: [...prev.barras, barToAdd] }));
        setShowBarModal(false);
        setNewBar({ nome: 'Nova Barra', atual: 20, max: 20, cor: '#3b82f6' });
      };

      const removeBar = (id) => {
        setCharacter(prev => ({ ...prev, barras: prev.barras.filter(b => b.id !== id) }));
      };

      const addAttribute = () => {
        if (!newAttr.nome) return;
        const attrToAdd = {
          id: 'a_' + Date.now(),
          nome: newAttr.nome.toUpperCase().substring(0, 4),
          valor: parseInt(newAttr.valor, 10) || 1,
          descricao: newAttr.nome
        };
        setCharacter(prev => ({ ...prev, atributos: [...prev.atributos, attrToAdd] }));
        setShowAttrModal(false);
        setNewAttr({ nome: '', valor: 1 });
      };

      const updateAttrVal = (id, delta) => {
        setCharacter(prev => ({
          ...prev,
          atributos: prev.atributos.map(a => a.id === id ? { ...a, valor: Math.max(0, a.valor + delta) } : a)
        }));
      };

      const removeAttribute = (id) => {
        setCharacter(prev => ({ ...prev, atributos: prev.atributos.filter(a => a.id !== id) }));
      };

      const addPericia = () => {
        if (!newPericia.nome) return;
        const pToAdd = {
          id: editingPericiaId || ('p_' + Date.now()),
          nome: newPericia.nome,
          atributo: newPericia.atributo,
          bonus: parseInt(newPericia.bonus, 10) || 0,
          treinamento: newPericia.treinamento
        };
        if (editingPericiaId) {
          setCharacter(prev => ({ ...prev, pericias: prev.pericias.map(p => p.id === editingPericiaId ? pToAdd : p) }));
        } else {
          setCharacter(prev => ({ ...prev, pericias: [...prev.pericias, pToAdd] }));
        }
        setEditingPericiaId(null);
        setShowPericiaModal(false);
        setNewPericia({ nome: '', atributo: 'INT', bonus: 0, treinamento: 'Destreinado' });
      };

      const startEditPericia = (p) => {
        setNewPericia({ nome: p.nome, atributo: p.atributo, bonus: p.bonus, treinamento: p.treinamento });
        setEditingPericiaId(p.id);
        setShowPericiaModal(true);
      };

      const removePericia = (id) => {
        setCharacter(prev => ({ ...prev, pericias: prev.pericias.filter(p => p.id !== id) }));
      };

      const addAtaque = () => {
        if (!newAtaque.nome) return;
        const atkToAdd = { ...newAtaque, id: editingAtaqueId || ('atk_' + Date.now()) };
        if (editingAtaqueId) {
          setCharacter(prev => ({ ...prev, ataques: prev.ataques.map(a => a.id === editingAtaqueId ? atkToAdd : a) }));
        } else {
          setCharacter(prev => ({ ...prev, ataques: [...prev.ataques, atkToAdd] }));

        setEditingAtaqueId(null);
        setShowAtaqueModal(false);
        setNewAtaque({ nome: '', teste: '2d20+5', danoFormula: '1d6+2', critico: '20/x2', alcance: 'Curto', tipo: 'Perfuração', especial: '' });

        setNewAtaque({ nome: atk.nome, teste: atk.teste, danoFormula: atk.danoFormula, critico: atk.critico, alcance: atk.alcance, tipo: atk.tipo, especial: atk.especial || '' });
        setEditingAtaqueId(atk.id);
        setShowAtaqueModal(true);
      };

      const removeAtaque = (id) => {
        setCharacter(prev => ({ ...prev, ataques: prev.ataques.filter(a => a.id !== id) }));
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            updateProfile('avatarUrl', reader.result);
          };
          reader.readAsDataURL(file);

      };

        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(character, null, 2));

        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `ficha_${character.profile.nome.replace(/\s+/g, '_')}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const importCharacterJSON = (e) => {
        const fileReader = new FileReader();
        if (e.target.files && e.target.files[0]) {
          fileReader.readAsText(e.target.files[0], "UTF-8");
          fileReader.onload = (event) => {
            try {
              const parsed = JSON.parse(event.target.result);
              if (parsed.profile && parsed.atributos) {
                setCharacter(parsed);
              } else {
                alert("Arquivo JSON inválido para Ficha de RPG.");
              }
            } catch (err) {
              alert("Erro ao ler o arquivo JSON.");
            }
          };
        }
      };

      const resetToDefault = () => {
        if (window.confirm("Tem certeza que deseja resetar a ficha para os valores padrão?")) {
          setCharacter(initialCharacterData);
        }
      };

      return (
        <div className="min-h-screen bg-neutral-950 text-neutral-100 font-sans selection:bg-red-900 selection:text-white pb-24 relative">
          {/* GLOW DECORATION */}
          <div className="fixed top-0 left-1/4 w-96 h-96 bg-red-900/10 rounded-full blur-3xl pointer-events-none" />
          <div className="fixed bottom-0 right-1/4 w-96 h-96 bg-emerald-950/20 rounded-full blur-3xl pointer-events-none" />

          {/* HEADER NAVBAR */}
          <header className="border-b border-neutral-800 bg-neutral-900/80 backdrop-blur sticky top-0 z-40 px-4 py-3">
            <div className="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
              <div className="flex items-center gap-3">
                <div className="p-2 bg-red-950/80 border border-red-800/50 rounded-lg text-red-500 shadow-lg shadow-red-950/50">
                  <Icon name="sparkles" className="w-6 h-6 animate-pulse" />

                            </div>
                          );
                        })}
                    </div>
                  </div>
                )}

                {/* TAB 3: ANOTAÇÕES */}
                {activeTab === 'bio' && (
                  <div className="space-y-3 flex-1 flex flex-col">
                    <label className="text-xs font-bold text-neutral-400 uppercase tracking-wider">
                      Histórico, Anotações e Pistas da Investigação
                    </label>
                    <textarea
                      value={character.anotacoes}
                      onChange={(e) => setCharacter({ ...character, anotacoes: e.target.value })}
                      placeholder="Escreva aqui detalhes sobre o personagem, segredos, itens de investigação..."
                      className="w-full flex-1 min-h-[300px] bg-neutral-950 border border-neutral-800 rounded-lg p-3 text-xs text-neutral-200 focus:outline-none focus:border-red-500 font-mono leading-relaxed resize-none"
                    />
                  </div>
                )}

              </div>

              {/* RIGHT COLUMN: ROLADOR DE DADOS LIVRE & LOG */}
              <div className="lg:col-span-4 bg-neutral-900/80 border border-neutral-800 rounded-xl p-5 shadow-xl flex flex-col justify-between">
                <div className="space-y-4">
                  <h2 className="text-lg font-bold text-neutral-100 flex items-center gap-2">
                    <D20Icon className="w-5 h-5 text-red-500" /> Rolador Geral
                  </h2>

                  <div className="grid grid-cols-4 gap-2">
                    {['d2', 'd4', 'd6', 'd8', 'd10', 'd12', 'd20', 'd100'].map((d) => (
                      <button
                        key={d}
                        onClick={() => rollDiceFormula(d, `Dado ${d.toUpperCase()}`)}
                        className="py-1.5 bg-neutral-950 hover:bg-neutral-800 border border-neutral-800 rounded text-xs font-bold text-red-400 hover:text-red-300 transition"
                      >
                        {d.toUpperCase()}
                      </button>
                    ))}
                  </div>

                  <div className="space-y-1.5">
                    <label className="text-[11px] text-neutral-400">Fórmula Customizada (ex: 2d20+1d6+5):</label>
                    <div className="flex gap-2">
                      <input
                        type="text"
                        value={customDiceInput}
                        onChange={(e) => setCustomDiceInput(e.target.value)}
                        placeholder="2d20+5"
                        className="flex-1 bg-neutral-950 border border-neutral-800 rounded px-3 py-1.5 text-xs text-neutral-200 focus:outline-none focus:border-red-500 font-mono"
                      />
                      <button
                        onClick={() => rollDiceFormula(customDiceInput, 'Rolagem Customizada')}
                        className="px-3 py-1.5 bg-red-950 hover:bg-red-900 text-red-200 border border-red-800/60 rounded text-xs font-bold transition"
                      >
                        Rolar
                      </button>
                    </div>
                  </div>

                  <div className="pt-3 border-t border-neutral-800">
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-xs font-bold text-neutral-400 uppercase tracking-wider">Histórico de Rolagens</span>
                      {diceLogs.length > 0 && (
                        <button
                          onClick={() => setDiceLogs([])}
                          className="text-[10px] text-neutral-500 hover:text-red-400 transition"
                        >
                          Limpar
                        </button>
                      )}
                    </div>

                    <div className="space-y-2 max-h-[340px] overflow-y-auto pr-1 custom-scrollbar">
                      {diceLogs.length === 0 ? (
                        <p className="text-neutral-600 text-xs text-center py-8">Nenhuma rolagem efetuada ainda.</p>
                      ) : (
                        diceLogs.map((log) => (
                          <div
                            key={log.id}
                            className="bg-neutral-950/90 border border-neutral-800/80 p-2.5 rounded-lg space-y-1"
                          >
                            <div className="flex justify-between items-center text-xs">
                              <span className="font-bold text-neutral-300">{log.title}</span>
                              <span className="text-[10px] text-neutral-500">{log.timestamp}</span>
                            </div>
                            <div className="flex justify-between items-end">
                              <span className="text-[11px] text-neutral-400 font-mono break-all max-w-[180px]">
                                {log.detail}
                              </span>
                              <span className="text-xl font-black text-red-500 bg-red-950/40 border border-red-900/50 px-2 py-0.5 rounded">
                                {log.result}
                              </span>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>

                </div>
              </div>

            </div>

          </main>

          {/* POP-UP / TOAST FOR RECENT DICE ROLL RESULTS */}
          {diceToast && (
            <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 max-w-md w-11/12">
              <div className="bg-neutral-900/95 border-2 border-red-600/80 rounded-2xl p-4 shadow-2xl shadow-red-950/80 backdrop-blur-md flex items-center justify-between gap-4">
                <div className="flex items-center gap-3">
                  <div className="p-3 bg-red-950 rounded-xl border border-red-800 text-red-400 shadow-inner">
                    <D20Icon className="w-7 h-7 animate-spin-once" />
                  </div>
                  <div className="space-y-0.5">
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-bold text-neutral-400 uppercase tracking-wide">{diceToast.title}</span>
                      <span className="text-[10px] text-neutral-500 font-mono">({diceToast.formula})</span>
                    </div>
                    
                    {/* DICES LIST DISPLAY */}
                    {diceToast.individualRolls && diceToast.individualRolls.length > 0 && (
                      <div className="flex flex-wrap gap-1 py-1">
                        {diceToast.individualRolls.map((d, idx) => (
                          <span 
                            key={idx} 
                            className={`text-xs px-2 py-0.5 rounded font-mono font-bold border ${
                              d.value === d.sides 
                                ? 'bg-emerald-950 text-emerald-400 border-emerald-700 animate-pulse' 
                                : d.value === 1 
                                ? 'bg-red-950 text-red-400 border-red-800' 
                                : 'bg-neutral-950 text-neutral-300 border-neutral-800'
                            }`}
                          >
                            d{d.sides}: {d.value}
                          </span>
                        ))}
                      </div>
                    )}

                    <p className="text-[11px] text-neutral-400 font-mono leading-tight">{diceToast.detail}</p>
                  </div>
                </div>

                <div className="flex items-center gap-3">
                  <div className="text-right">
                    <span className="text-[10px] text-neutral-500 uppercase block font-bold">Total</span>
                    <span className="text-3xl font-black text-red-500 drop-shadow-md">
                      {diceToast.result}
                    </span>
                  </div>
                  <button 
                    onClick={() => setDiceToast(null)}
                    className="text-neutral-500 hover:text-neutral-200 p-1 transition"
                    title="Fechar"
                  >
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODALS */}
          {showAttrModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-neutral-900 border border-neutral-800 rounded-xl p-5 max-w-xs w-full space-y-4 shadow-2xl">
                <h3 className="font-bold text-neutral-100 text-sm">Adicionar Atributo Customizado</h3>
                <div className="space-y-3 text-xs">
                  <div>
                    <label className="text-neutral-400 block mb-1">Sigla/Nome do Atributo:</label>
                    <input
                      type="text"
                      placeholder="Ex: DEX, SOR"
                      value={newAttr.nome}
                      onChange={(e) => setNewAttr({ ...newAttr, nome: e.target.value })}
                      className="w-full bg-neutral-950 border border-neutral-800 rounded p-2 text-neutral-200 focus:outline-none focus:border-red-500"
                    />
                  </div>
                  <div>
                    <label className="text-neutral-400 block mb-1">Valor Inicial:</label>
                    <input
                      type="number"
                      value={newAttr.valor}
                      onChange={(e) => setNewAttr({ ...newAttr, valor: e.target.value })}
                      className="w-full bg-neutral-950 border border-neutral-800 rounded p-2 text-neutral-200 focus:outline-none focus:border-red-500"
                    />
                  </div>
                </div>
                <div className="flex justify-end gap-2 text-xs pt-2">
                  <button
                    onClick={() => setShowAttrModal(false)}
                    className="px-3 py-1.5 bg-neutral-800 text-neutral-300 rounded hover:bg-neutral-700"
                  >
                    Cancelar
                  </button>
                  <button
                    onClick={addAttribute}
                    className="px-3 py-1.5 bg-red-950 text-red-200 border border-red-800 rounded hover:bg-red-900"
                  >
                    Adicionar
                  </button>
                </div>
              </div>
            </div>
          )}

          {showBarModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-neutral-900 border border-neutral-800 rounded-xl p-5 max-w-xs w-full space-y-4 shadow-2xl">
                <h3 className="font-bold text-neutral-100 text-sm">Adicionar Barra de Status</h3>
                <div className="space-y-3 text-xs">
                  <div>
                    <label className="text-neutral-400 block mb-1">Nome da Barra:</label>
                    <input
                      type="text"
                      placeholder="Ex: Escudo, Mana, Calma"
                      value={newBar.nome}
                      onChange={(e) => setNewBar({ ...newBar, nome: e.target.value })}
                      className="w-full bg-neutral-950 border border-neutral-800 rounded p-2 text-neutral-200 focus:outline-none focus:border-red-500"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-neutral-400 block mb-1">Valor Atual:</label>
                      <input
                        type="number"
                        value={newBar.atual}
                        onChange={(e) => setNewBar({ ...newBar, atual: parseInt(e.target.value, 10) || 0 })}
                        className="w-full bg-neutral-950 border border-neutral-800 rounded p-2 text-neutral-200 focus:outline-none focus:border-red-500"
                      />
                    </div>
                    <div>
                      <label className="text-neutral-400 block mb-1">Valor Máximo:</label>
                      <input
                        type="number"
                        value={newBar.max}
                        onChange={(e) => setNewBar({ ...newBar, max: parseInt(e.target.value, 10) || 1 })}
                        className="w-full bg-neutral-950 border border-neutral-800 rounded p-2 text-neutral-200 focus:outline-none focus:border-red-500"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="text-neutral-400 block mb-1">Cor da Barra:</label>
                    <input
                      type="color"
                      value={newBar.cor}
                      onChange={(e) => setNewBar({ ...newBar, cor: e.target.value })}
                      className="w-full h-8 rounded bg-neutral-950 border border-neutral-800 cursor-pointer"
                    />
                  </div>
                </div>
                <div className="flex justify-end gap-2 text-xs pt-2">
                  <button
                    onClick={() => setShowBarModal(false)}
                    className="px-3 py-1.5 bg-neutral-800 text-neutral-300 rounded hover:bg-neutral-700"
                  >
                    Cancelar
                  </button>
                  <button
                    onClick={addBar}
                    className="px-3 py-1.5 bg-red-950 text-red-200 border border-red-800 rounded hover:bg-red-900"
                  >
                    Adicionar
                  </button>
                </div>
              </div>
            </div>
          )}

          {showPericiaModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-neutral-900 border border-neutral-800 rounded-xl p-5 max-w-sm w-full space-y-4 shadow-2xl">
                <h3 className="font-bold text-neutral-100 text-sm">{editingPericiaId ? 'Editar Perícia' : 'Adicionar Nova Perícia'}</h3>
                <div className="space-y-3 text-xs">
                  <div>
                    <label className="text-neutral-400 block mb-1">Nome da Perícia:</label>
                    <input
                      type="text"
                      placeholder="Ex: Tática, Pilotagem"
                      value={newPericia.nome}
                      onChange={(e) => setNewPericia({ ...newPericia, nome: e.target.value })}
                      className="w-full bg-neutral-950 border border-neutral-800 rounded p-2 text-neutral-200 focus:outline-none focus:border-red-500"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-neutral-400 block mb-1">Atributo Base:</label>
                      <select
                        value={newPericia.atributo}
                        onChange={(e) => setNewPericia({ ...newPericia, atributo: e.target.value })}
                        className="w-full bg-neutral-950 border border-neutral-800 rounded p-2 text-neutral-200 focus:outline-none focus:border-red-500"
                      >
                        {character.atributos.map(a => (
                          <option key={a.id} value={a.nome}>{a.nome}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="text-neutral-400 block mb-1">Bônus (+X):</label>
                      <input
                        type="number"
                        value={newPericia.bonus}
                        onChange={(e) => setNewPericia({ ...newPericia, bonus: e.target.value })}
                        className="w-full bg-neutral-950 border border-neutral-800 rounded p-2 text-neutral-200 focus:outline-none focus:border-red-500"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="text-neutral-400 block mb-1">Grau de Treinamento:</label>
                    <select
                      value={newPericia.treinamento}
                      onChange={(e) => setNewPericia({ ...newPericia, treinamento: e.target.value })}
                      className="w-full bg-neutral-950 border border-neutral-800 rounded p-2 text-neutral-200 focus:outline-none focus:border-red-500"
                    >
                      <option value="Destreinado">Destreinado</option>
                      <option value="Destreinado">Destreinado (+5)</option>
                      <option value="Destreinado">Destreinado (+10)</option>
                      <option value="Expert">Expert (+15)</option>
                    </select>
                  </div>
                </div>
                <div className="flex justify-end gap-2 text-xs pt-2">
                  <button
                    onClick={() => { setShowPericiaModal(false); setEditingPericiaId(null); }}
                    className="px-3 py-1.5 bg-neutral-800 text-neutral-300 rounded hover:bg-neutral-700"
                  >
                    Cancelar
                  </button>
                  <button
                    onClick={addPericia}
                    className="px-3 py-1.5 bg-red-950 text-red-200 border border-red-800 rounded hover:bg-red-900"
                  >
                    {editingPericiaId ? 'Salvar' : 'Adicionar'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {showAtaqueModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-neutral-900 border border-neutral-800 rounded-xl p-5 max-w-md w-full space-y-4 shadow-2xl">
                <h3 className="font-bold text-neutral-100 text-sm">{editingAtaqueId ? 'Editar Ataque' : 'Cadastrar Novo Ataque'}</h3>
                <div className="space-y-3 text-xs">
                  <div>
                    <label className="text-neutral-400 block mb-1">Nome do Ataque/Arma/Ritual:</label>
                    <input
                      type="text"
                      placeholder="Ex: Espada Longa, Decadência"
                      value={newAtaque.nome}
                      onChange={(e) => setNewAtaque({ ...newAtaque, nome: e.target.value })}
                      className="w-full bg-neutral-950 border border-neutral-800 rounded p-2 text-neutral-200 focus:outline-none focus:border-red-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-neutral-400 block mb-1">Teste de Ataque (dado/fórmula):</label>
                      <input
                        type="text"
                        placeholder="Ex: 3d20+5 ou 2d20"
                        value={newAtaque.teste}
                        onChange={(e) => setNewAtaque({ ...newAtaque, teste: e.target.value })}
                        className="w-full bg-neutral-950 border border-neutral-800 rounded p-2 text-neutral-200 focus:outline-none focus:border-red-500 font-mono"
                      />
                    </div>
                    <div>
                      <label className="text-neutral-400 block mb-1">Fórmula de Dano:</label>
                      <input
                        type="text"
                        placeholder="Ex: 2d6+1d8+3"
                        value={newAtaque.danoFormula}
                        onChange={(e) => setNewAtaque({ ...newAtaque, danoFormula: e.target.value })}
                        className="w-full bg-neutral-950 border border-neutral-800 rounded p-2 text-neutral-200 focus:outline-none focus:border-red-500 font-mono"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="text-neutral-400 block mb-1">Margem Crítica:</label>
                      <input
                        type="text"
                        placeholder="19/x3"
                        value={newAtaque.critico}
                        onChange={(e) => setNewAtaque({ ...newAtaque, critico: e.target.value })}
                        className="w-full bg-neutral-950 border border-neutral-800 rounded p-2 text-neutral-200 focus:outline-none focus:border-red-500"
                      />
                    </div>
                    <div>
                      <label className="text-neutral-400 block mb-1">Alcance:</label>
                      <input
                        type="text"
                        placeholder="Curto, Médio..."
                        value={newAtaque.alcance}
                        onChange={(e) => setNewAtaque({ ...newAtaque, alcance: e.target.value })}
                        className="w-full bg-neutral-950 border border-neutral-800 rounded p-2 text-neutral-200 focus:outline-none focus:border-red-500"
                      />
                    </div>
                    <div>
                      <label className="text-neutral-400 block mb-1">Tipo de Dano:</label>
                      <input
                        type="text"
                        placeholder="Corte, Morte..."
                        value={newAtaque.tipo}
                        onChange={(e) => setNewAtaque({ ...newAtaque, tipo: e.target.value })}
                        className="w-full bg-neutral-950 border border-neutral-800 rounded p-2 text-neutral-200 focus:outline-none focus:border-red-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-neutral-400 block mb-1">Efeitos Especiais / Observações:</label>
                    <input
                      type="text"
                      placeholder="Ex: Ignora 5 de RD de Sangue"
                      value={newAtaque.especial}
                      onChange={(e) => setNewAtaque({ ...newAtaque, especial: e.target.value })}
                      className="w-full bg-neutral-950 border border-neutral-800 rounded p-2 text-neutral-200 focus:outline-none focus:border-red-500"
                    />
                  </div>
                </div>

                <div className="flex justify-end gap-2 text-xs pt-2">
                  <button
                    onClick={() => { setShowAtaqueModal(false); setEditingAtaqueId(null); }}
                    className="px-3 py-1.5 bg-neutral-800 text-neutral-300 rounded hover:bg-neutral-700"
                  >
                    Cancelar
                  </button>
                  <button
                    onClick={addAtaque}
                    className="px-3 py-1.5 bg-red-950 text-red-200 border border-red-800 rounded hover:bg-red-900"
                  >
                    {editingAtaqueId ? 'Salvar' : 'Adicionar'}
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
